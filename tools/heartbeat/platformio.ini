; Heartbeat: blinks the onboard lights so you can see the Feather is powered and running.
; Flash:  cd tools/heartbeat && pio run -t upload --upload-port <port>
[env:adafruit_feather_esp32_v2]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
