; DressCheck pod — Adafruit Feather ESP32 V2
; Build:  cd firmware && pio run
; Upload: pio run -t upload
; Serial: pio device monitor -b 115200

[platformio]
default_envs = adafruit_feather_esp32_v2

[env:adafruit_feather_esp32_v2]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
; Feather V2 has 8 MB flash; default app slot is too small for BLE + libs
board_build.partitions = huge_app.csv
lib_deps =
    adafruit/Adafruit TCS34725@^1.4.4
    adafruit/Adafruit NeoPixel@^1.12.3
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Bench build for testing with parts missing. NOT for the demo: skipped sensors are
; ignored entirely. Flash with:  pio run -e bench -t upload
;   -DSKIP_MOISTURE : moisture pad not wired (holds centre/edge at 0 %, no moisture fault)
;   -DBENCH_CMDS    : serial commands n/s/a/v for driving the pod over USB
[env:bench]
extends = env:adafruit_feather_esp32_v2
build_flags =
    ${env:adafruit_feather_esp32_v2.build_flags}
    -DSKIP_MOISTURE
    -DBENCH_CMDS

; Normal behaviour (moisture enabled) plus the bench serial commands. Not for the demo.
[env:debug]
extends = env:adafruit_feather_esp32_v2
build_flags =
    ${env:adafruit_feather_esp32_v2.build_flags}
    -DBENCH_CMDS

